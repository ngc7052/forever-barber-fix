name: CI

# Syntax-checks the Lua and sanity-checks the TOC on every push to master and
# every pull request. The release workflow calls this too, so nothing is ever
# published without it having passed on exactly the commit being released.

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lua syntax and TOC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua 5.1
        # The WoW client runs Lua 5.1; luac from that version is the closest
        # thing to the parser the game will use.
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - name: Lua syntax
        run: |
          set -euo pipefail
          for f in *.lua; do luac5.1 -p "$f" && echo "ok: $f"; done

      - name: TOC and changelog
        run: tools/check-toc.sh

      - name: Package
        run: tools/package.sh
